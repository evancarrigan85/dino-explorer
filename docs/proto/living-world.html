<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Living World Prototype</title>
<style>
  :root { --ink: #2a1a0c; --paper: #f4ead2; --bg: #17130d; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--paper); font: 15px/1.45 Georgia, 'Times New Roman', serif; }
  .bar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; padding: 10px 16px; }
  .bar b { margin-right: 6px; }
  .bar button { font: inherit; font-size: 14px; background: #3a2c1c; color: var(--paper); border: 1px solid #6b5536; border-radius: 18px; padding: 6px 13px; cursor: pointer; }
  .bar button.on { background: #e3c57d; color: var(--ink); border-color: #e3c57d; }
  #wrap { position: relative; max-width: 1400px; margin: 0 auto; }
  canvas { display: block; width: 100%; height: auto; touch-action: none; }
  .tip { position: absolute; pointer-events: none; background: rgba(250, 241, 218, 0.96); color: var(--ink); padding: 5px 9px; border-radius: 7px; font-size: 13px; display: none; max-width: 280px; box-shadow: 0 2px 8px rgba(0,0,0,.35); }
  .tip b { display: block; }
  .cap { max-width: 980px; padding: 10px 16px 24px; color: #eadfc4; }
  .cap b { color: #fff; }
  .cap small { display: block; color: #b9ab8c; margin-top: 6px; }
</style>
</head>
<body>
<div class="bar">
  <b>Living world — a prototype of the close-up</b>
  <button data-s="cret" class="on">Hell Creek, 66 million years ago</button>
  <button data-s="ice">A Neanderthal rock shelter, about 50,000 years ago</button>
  <button id="again">Zoom in again</button>
  <button id="still">Hold still</button>
</div>
<div id="wrap"><canvas id="c" width="1400" height="820"></canvas><div class="tip" id="tip"></div></div>
<div class="cap" id="cap"></div>
<script>
// Everything here is a function of the clock: no Math.random. Sizes are to scale with each other; colours are not known.
const cv = document.getElementById('c'), c = cv.getContext('2d'), W = cv.width, H = cv.height;
const TAU = Math.PI * 2, clamp = (v, a, b) => Math.max(a, Math.min(b, v)), lerp = (a, b, t) => a + (b - a) * t;
const ss = t => { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); };
const hash = (i, k = 0) => { const v = Math.sin(i * 127.1 + k * 311.7 + 17.3) * 43758.5453; return v - Math.floor(v); };
const win = (t, a, b, r = 1.2) => ss((t - a) / r) * (1 - ss((t - b) / r));      // 0 → 1 between a and b, eased
const INK = '#2a1a0c';
const shade = (hex, f) => { const n = parseInt(hex.slice(1), 16), ch = [n >> 16, (n >> 8) & 255, n & 255].map(v => Math.round(clamp(f > 0 ? v + (255 - v) * f : v * (1 + f), 0, 255))); return '#' + ch.map(v => v.toString(16).padStart(2, '0')).join(''); };

// ── the camera: it starts high and looking almost straight down (the map), then tilts and comes in (the close-up) ──
const CAM = { th: 0.79, dist: 78, F: 825, tx: 0, tz: 50, x: 0, h: 0, z: 0 };
function setCam(th, dist) { CAM.th = th; CAM.dist = dist; CAM.h = dist * Math.sin(th); CAM.z = CAM.tz - dist * Math.cos(th); CAM.x = CAM.tx; }
function proj(x, y, z) {
  const s = Math.sin(CAM.th), co = Math.cos(CAM.th), rx = x - CAM.x, ry = y - CAM.h, rz = z - CAM.z;
  const d = -ry * s + rz * co, up = ry * co + rz * s;
  return [W / 2 + CAM.F * rx / d, H / 2 - CAM.F * up / d, CAM.F / d];
}

// ── the ground: painted once per scene in world coordinates, drawn in perspective a row at a time ──
let GX0 = -210, GX1 = 210, GZ0 = -70, GZ1 = 180; const PPM = 5;
const tex = document.createElement('canvas'), tc = tex.getContext('2d'), TX = x => (x - GX0) * PPM, TZ = z => (GZ1 - z) * PPM;
// value noise from a fixed table (no chance: the table is built from the hash), summed over octaves: soft, painterly ground
const NT = new Float32Array(65536); for (let i = 0; i < 65536; i++) NT[i] = hash(i, 91);
const vn = (x, y) => { const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi, u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const h = (a, b) => NT[((a & 255) << 8) | (b & 255)]; return lerp(lerp(h(xi, yi), h(xi + 1, yi), u), lerp(h(xi, yi + 1), h(xi + 1, yi + 1), u), v); };
const fbm = (x, y, o = 4) => { let s = 0, a = 0.5, f = 1, n = 0; for (let i = 0; i < o; i++) { s += a * vn(x * f + i * 17.3, y * f - i * 9.1); n += a; a *= 0.5; f *= 2.03; } return s / n; };
const hex = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
const mixc = (a, b, t) => [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)];
function paintGround(colour) {     // colour(x, z) → [r, g, b], for every pixel of the ground, with a fine grain on top
  tex.width = (GX1 - GX0) * PPM; tex.height = (GZ1 - GZ0) * PPM;
  const img = tc.createImageData(tex.width, tex.height), d = img.data;
  for (let py = 0; py < tex.height; py++) { const z = GZ1 - (py + 0.5) / PPM;
    for (let px = 0; px < tex.width; px++) { const x = GX0 + (px + 0.5) / PPM, col = colour(x, z), g = 1 + (NT[(px * 7 + py * 131) & 65535] - 0.5) * 0.07, i = (py * tex.width + px) * 4;
      d[i] = col[0] * g; d[i + 1] = col[1] * g; d[i + 2] = col[2] * g; d[i + 3] = 255; } }
  tc.putImageData(img, 0, 0);
}
function drawGround() {
  const s = Math.sin(CAM.th), co = Math.cos(CAM.th);
  for (let sy = 0; sy < H; sy += 2) {
    const v = (H / 2 - sy - 1) / CAM.F, den = s - v * co; if (den <= 0.02) continue;
    const t = CAM.h / den, z = CAM.z + t * (co + v * s), half = t * (W / 2) / CAM.F;
    c.drawImage(tex, TX(CAM.x - half), TZ(z), 2 * half * PPM, 1, 0, sy, W, 2);
  }
}
function blot(x, z, r, col, a) { tc.globalAlpha = a; tc.fillStyle = col; tc.beginPath(); tc.ellipse(TX(x), TZ(z), r * PPM, r * PPM * 0.8, 0, 0, TAU); tc.fill(); tc.globalAlpha = 1; }

// ── drawing helpers in an animal's own side view: metres, x forward, y up, the ground at y = 0 ──
const bez = (p0, p1, p2, n) => { const o = []; for (let i = 0; i <= n; i++) { const t = i / n, u = 1 - t; o.push([u * u * p0[0] + 2 * u * t * p1[0] + t * t * p2[0], u * u * p0[1] + 2 * u * t * p1[1] + t * t * p2[1]]); } return o; };
function tube(pts, w0, w1) {
  const L = [], R = [];
  pts.forEach((p, i) => { const a = pts[Math.max(0, i - 1)], b = pts[Math.min(pts.length - 1, i + 1)], dx = b[0] - a[0], dy = b[1] - a[1], d = Math.hypot(dx, dy) || 1, w = lerp(w0, w1, i / (pts.length - 1)) / 2;
    L.push([p[0] - dy / d * w, p[1] + dx / d * w]); R.push([p[0] + dy / d * w, p[1] - dx / d * w]); });
  return L.concat(R.reverse());
}
function path(o, poly, smooth = true) {
  const P = poly.map(p => [o.X + o.f * p[0] * o.s, o.Y - p[1] * o.s]);
  c.beginPath();
  if (!smooth) { P.forEach((p, i) => i ? c.lineTo(p[0], p[1]) : c.moveTo(p[0], p[1])); c.closePath(); return; }
  const n = P.length; c.moveTo((P[n - 1][0] + P[0][0]) / 2, (P[n - 1][1] + P[0][1]) / 2);
  for (let i = 0; i < n; i++) { const a = P[i], b = P[(i + 1) % n]; c.quadraticCurveTo(a[0], a[1], (a[0] + b[0]) / 2, (a[1] + b[1]) / 2); }
  c.closePath();
}
const rot = (p, a) => [p[0] * Math.cos(a) - p[1] * Math.sin(a), p[0] * Math.sin(a) + p[1] * Math.cos(a)];
const add = (p, q) => [p[0] + q[0], p[1] + q[1]];
function ik(hip, tgt, a, b, fwd) {
  let dx = tgt[0] - hip[0], dy = tgt[1] - hip[1], d = clamp(Math.hypot(dx, dy), Math.abs(a - b) + 1e-3, a + b - 1e-3);
  const base = Math.atan2(dy, dx), ang = Math.acos(clamp((a * a + d * d - b * b) / (2 * a * d), -1, 1));
  const k1 = add(hip, [a * Math.cos(base + ang), a * Math.sin(base + ang)]), k2 = add(hip, [a * Math.cos(base - ang), a * Math.sin(base - ang)]);
  const end = add(hip, [d * Math.cos(base), d * Math.sin(base)]);
  return [(k1[0] > k2[0]) === fwd ? k1 : k2, end];
}
function footAt(q, stride, lift, x0) {
  q = ((q % 1) + 1) % 1;
  if (q < 0.62) return [x0 + stride * (0.5 - q / 0.62), 0];
  const u = (q - 0.62) / 0.38; return [x0 + stride * (-0.5 + u), lift * Math.sin(Math.PI * u)];
}

// ── the rigs: one per kind of body, proportioned from each animal's outline; the head is its own little drawing ──
const SP = {
  trike: { name: 'Triceratops', fill: '#9a8052', len: 9,
    body: [[-1.55, 2.3], [-0.6, 2.85], [0.6, 2.9], [1.8, 2.55], [2.65, 2.05], [2.7, 1.2], [1.7, 0.78], [0.2, 0.75], [-1.0, 1.1], [-1.65, 1.8]],
    neck: { base: [2.35, 1.85], ctrl: [2.65, 1.95], tip: [2.95, 1.9], down: [3.05, 0.95], up: [3.0, 2.25], w: [0.78, 0.66] },
    headA: -0.2, downA: -0.85, upA: 0.1,
    tail: { base: [-1.45, 2.0], ctrl: [-2.8, 1.75], tip: [-4.3, 1.15], w: [0.85, 0.06] },
    legs: [[0.05, 1.95, 1.0, 0.92, 0.3, 0.15, 0, 1, 0], [2.05, 1.6, 0.8, 0.75, 0.16, 2.2, 1, 1, 0.25], [-0.05, 1.95, 1.0, 0.92, 0.3, 0.05, 0, 0, 0.5], [1.95, 1.6, 0.8, 0.75, 0.16, 2.1, 1, 0, 0.75]],
    lw: [0.46, 0.34, 0.25], stride: 1.3, lift: 0.28, head: trikeHead },
  edmo: { name: 'Edmontosaurus', fill: '#7f8b6b', len: 12,
    body: [[-1.75, 2.9], [-0.5, 3.4], [1.0, 3.2], [2.3, 2.7], [3.15, 2.15], [3.1, 1.4], [2.0, 1.15], [0.5, 1.3], [-0.9, 1.6], [-1.85, 2.3]],
    neck: { base: [3.0, 2.15], ctrl: [3.65, 2.55], tip: [4.15, 2.7], down: [4.35, 0.75], up: [3.85, 3.6], w: [0.55, 0.36] },
    headA: -0.25, downA: -1.15, upA: 0.15,
    tail: { base: [-1.7, 2.6], ctrl: [-3.8, 2.65], tip: [-6.9, 2.05], w: [0.95, 0.05] },
    legs: [[0.1, 2.55, 1.25, 1.12, 0.55, 0.25, 0, 1, 0], [2.75, 1.85, 0.92, 0.82, 0.12, 2.85, 1, 1, 0.25], [-0.1, 2.55, 1.25, 1.12, 0.55, 0.1, 0, 0, 0.5], [2.65, 1.85, 0.92, 0.82, 0.12, 2.75, 1, 0, 0.75]],
    lw: [0.48, 0.3, 0.2], stride: 1.6, lift: 0.32, head: edmoHead },
  rex: { name: 'Tyrannosaurus rex', fill: '#6f5a40', len: 12.3,
    body: [[-1.45, 4.0], [0, 4.5], [1.3, 4.4], [2.4, 4.05], [3.0, 3.45], [2.7, 2.6], [1.6, 2.3], [0.4, 2.5], [-0.8, 2.95], [-1.55, 3.55]],
    neck: { base: [2.6, 3.75], ctrl: [3.2, 4.35], tip: [3.65, 4.35], down: [3.95, 3.3], up: [3.45, 4.9], w: [0.66, 0.52] },
    headA: -0.12, downA: -0.5, upA: 0.35,
    tail: { base: [-1.4, 3.65], ctrl: [-3.6, 3.6], tip: [-6.8, 3.0], w: [1.05, 0.05] },
    legs: [[0.1, 3.35, 1.4, 1.3, 0.68, 0.25, 0, 1, 0], [-0.1, 3.35, 1.4, 1.3, 0.68, 0.05, 0, 0, 0.5]],
    arms: [[2.35, 3.0, 0.45, 0.4]], lw: [0.62, 0.38, 0.24], stride: 2.1, lift: 0.45, head: rexHead },
  quetz: { name: 'Quetzalcoatlus', fill: '#b9aa8d', len: 4,
    body: [[-0.55, 2.1], [0.05, 2.48], [0.8, 2.55], [1.15, 2.25], [0.95, 1.8], [0.2, 1.7], [-0.45, 1.85]],
    neck: { base: [1.0, 2.4], ctrl: [1.45, 3.5], tip: [1.85, 4.55], down: [2.9, 0.9], up: [1.6, 4.8], w: [0.24, 0.15] },
    headA: -0.35, downA: -1.25, upA: -0.1,
    tail: { base: [-0.5, 2.0], ctrl: [-0.7, 1.95], tip: [-0.85, 1.85], w: [0.12, 0.02] },
    legs: [[0.05, 1.9, 0.9, 0.9, 0.28, 0.1, 0, 1, 0], [0.95, 2.2, 1.25, 1.35, 0.1, 1.6, 1, 1, 0.25], [-0.05, 1.9, 0.9, 0.9, 0.28, 0.0, 0, 0, 0.5], [0.9, 2.2, 1.25, 1.35, 0.1, 1.5, 1, 0, 0.75]],
    lw: [0.2, 0.15, 0.1], stride: 0.9, lift: 0.2, head: quetzHead, wingFold: true },
  mammoth: { name: 'Woolly mammoth', fill: '#6b4a2e', len: 5.2, shaggy: true,
    body: [[-1.15, 2.45], [-0.6, 2.95], [0.6, 3.38], [1.5, 3.12], [1.95, 2.5], [1.85, 1.6], [0.8, 1.32], [-0.4, 1.38], [-1.15, 1.9]],
    neck: { base: [1.7, 2.6], ctrl: [1.9, 2.7], tip: [2.1, 2.7], down: [2.2, 2.35], up: [2.1, 2.9], w: [1.0, 0.9] },
    headA: -0.1, downA: -0.35, upA: 0.1,
    tail: { base: [-1.1, 2.3], ctrl: [-1.3, 2.0], tip: [-1.35, 1.5], w: [0.14, 0.06] },
    legs: [[-0.35, 2.0, 1.0, 0.92, 0.12, -0.3, 0, 1, 0], [1.35, 2.0, 1.0, 0.92, 0.12, 1.4, 1, 1, 0.25], [-0.45, 2.0, 1.0, 0.92, 0.12, -0.4, 0, 0, 0.5], [1.25, 2.0, 1.0, 0.92, 0.12, 1.3, 1, 0, 0.75]],
    lw: [0.62, 0.52, 0.5], stride: 1.1, lift: 0.22, head: mammothHead },
  rhino: { name: 'Woolly rhinoceros', fill: '#7a5a3c', len: 3.6, shaggy: true,
    body: [[-1.3, 1.55], [-0.6, 1.86], [0.5, 2.02], [1.3, 1.78], [1.62, 1.4], [1.5, 0.78], [0.4, 0.6], [-0.8, 0.7], [-1.32, 1.1]],
    neck: { base: [1.42, 1.5], ctrl: [1.62, 1.42], tip: [1.82, 1.28], down: [1.9, 0.55], up: [1.85, 1.6], w: [0.62, 0.55] },
    headA: -0.25, downA: -0.75, upA: 0.05,
    tail: { base: [-1.3, 1.5], ctrl: [-1.45, 1.3], tip: [-1.5, 1.0], w: [0.1, 0.04] },
    legs: [[-0.25, 1.1, 0.55, 0.5, 0.1, -0.2, 0, 1, 0], [1.2, 1.1, 0.55, 0.5, 0.1, 1.25, 1, 1, 0.25], [-0.35, 1.1, 0.55, 0.5, 0.1, -0.3, 0, 0, 0.5], [1.1, 1.1, 0.55, 0.5, 0.1, 1.15, 1, 0, 0.75]],
    lw: [0.4, 0.32, 0.3], stride: 0.7, lift: 0.14, head: rhinoHead },
};
// legs: [rootX, rootY, a, b, m (foot segment), footX, front?, far?, phase]

const HEAD = 1.18;                                   // heads a little large: they read better small
function headTransform(o, tip, ang) { return p => { const q = add(tip, rot([p[0] * HEAD, p[1] * HEAD], ang)); return [o.X + o.f * q[0] * o.s, o.Y - q[1] * o.s]; }; }
function hpath(Hf, pts, smooth = true) {
  const P = pts.map(Hf); c.beginPath();
  if (!smooth) { P.forEach((p, i) => i ? c.lineTo(p[0], p[1]) : c.moveTo(p[0], p[1])); c.closePath(); return; }
  const n = P.length; c.moveTo((P[n - 1][0] + P[0][0]) / 2, (P[n - 1][1] + P[0][1]) / 2);
  for (let i = 0; i < n; i++) { const a = P[i], b = P[(i + 1) % n]; c.quadraticCurveTo(a[0], a[1], (a[0] + b[0]) / 2, (a[1] + b[1]) / 2); } c.closePath();
}
function eye(Hf, p, r, o) { const e = Hf(p), R = Math.max(1.6, r * 1.35 * o.s); c.fillStyle = '#fbf3df'; c.beginPath(); c.arc(e[0], e[1], R, 0, TAU); c.fill(); c.fillStyle = '#1a1008'; c.beginPath(); c.arc(e[0] + o.f * R * 0.2, e[1], R * 0.62, 0, TAU); c.fill(); c.fillStyle = '#fff'; c.beginPath(); c.arc(e[0] + o.f * R * 0.35 - R * 0.1, e[1] - R * 0.3, R * 0.22, 0, TAU); c.fill(); }
function horn(Hf, a, b, w0, w1, col, o) { const pts = tube(bez(a, [(a[0] + b[0]) / 2 + 0.05, (a[1] + b[1]) / 2 + 0.12], b, 8), w0, w1); hpath(Hf, pts, false); c.fillStyle = col; c.fill(); c.lineWidth = Math.max(0.6, 0.035 * o.s); c.strokeStyle = INK; c.stroke(); }
function inked(fill, o, w = 0.05) { c.fillStyle = fill; c.fill(); c.lineWidth = Math.max(0.8, w * o.s); c.strokeStyle = INK; c.stroke(); }

function trikeHead(o, Hf, sp, P) {
  const rim = []; for (let i = 0; i < 18; i++) { const a = i / 18 * TAU, r = 1 + 0.06 * Math.cos(i * 3); rim.push(add([-0.62, 0.72], rot([Math.cos(a) * 0.95 * r, Math.sin(a) * 0.82 * r], 0.75))); }
  hpath(Hf, rim); inked(shade(sp.fill, 0.12), o);
  for (let i = 0; i < 18; i += 2) { const p = Hf(rim[i]); c.fillStyle = shade(sp.fill, -0.15); c.beginPath(); c.arc(p[0], p[1], Math.max(1, 0.07 * o.s), 0, TAU); c.fill(); }
  horn(Hf, [0.72, 0.58], [1.85, 1.22], 0.17, 0.03, '#d9cba5', o);
  hpath(Hf, [[-0.15, 0.05], [0.1, 0.52], [0.65, 0.64], [1.2, 0.34], [1.65, 0.06], [1.82, -0.15], [1.55, -0.36], [0.9, -0.46], [0.25, -0.42]]); inked(sp.fill, o);
  hpath(Hf, [[1.5, -0.04], [1.84, -0.15], [1.55, -0.36]], false); inked(shade(sp.fill, -0.35), o, 0.03);
  horn(Hf, [0.62, 0.52], [1.72, 1.12], 0.18, 0.03, '#eee2c2', o);
  horn(Hf, [1.33, 0.26], [1.55, 0.56], 0.13, 0.02, '#eee2c2', o);
  eye(Hf, [0.52, 0.3], 0.085, o);
}
function edmoHead(o, Hf, sp, P) {
  hpath(Hf, [[-0.15, 0.1], [0.2, 0.33], [0.72, 0.3], [1.15, 0.18], [1.42, 0.09], [1.52, -0.06], [1.38, -0.2], [0.9, -0.25], [0.3, -0.3], [-0.12, -0.16]]); inked(sp.fill, o);
  hpath(Hf, [[1.05, 0.15], [1.45, 0.08], [1.53, -0.06], [1.38, -0.2], [1.05, -0.17]]); inked('#c9c09a', o, 0.03);
  eye(Hf, [0.33, 0.16], 0.075, o);
  const n = Hf([0.95, 0.06]); c.fillStyle = shade(sp.fill, -0.4); c.beginPath(); c.ellipse(n[0], n[1], Math.max(1, 0.12 * o.s), Math.max(0.6, 0.05 * o.s), 0, 0, TAU); c.fill();
}
function rexHead(o, Hf, sp, P) {
  const jaw = (P.jaw || 0) * 0.5;
  const J = p => Hf(add([0.05, -0.04], rot(add(p, [-0.05, 0.04]), -jaw)));

      off.forEach((d, i) => { const q = track(ek, T - i * 0.6), drink = win(T, 13 + i * 0.4, 27.5, 1.5), look = i === 2 ? win(T, 18, 21.5, 0.8) * drink : 0;
        A.push({ sp: SP.edmo, x: q.x + d[0], z: q.z + d[1], f: q.vx < -0.05 ? -1 : q.vx > 0.05 ? 1 : -1, P: { walk: clamp(Math.hypot(q.vx, q.vz) / 3, 0, 1), ph: T * 0.55 + i * 0.37, graze: drink * (1 - look), alert: Math.max(look, win(T, 28.5, 33, 0.7)), tailSway: Math.sin(T * 1.1 + i), t: T }, k: i === 4 ? 0.72 : 1 - i * 0.03, label: i === 0 ? 'Edmontosaurus (a herd)' : null, note: 'Duck-billed plant-eaters, the commonest big animal of Hell Creek.' }); });

        A.push({ sp: SP.quetz, x: q.x, z: q.z, f: q.vx < 0 ? -1 : 1, P: { walk: clamp(Math.hypot(q.vx, q.vz) / 1.5, 0, 1) * (1 - peck), ph: T * 0.6, graze: peck, t: T }, label: 'Quetzalcoatlus', note: 'A giant pterosaur that hunted on foot as well as flying (a reading of its bones; still argued).' }); }
      if (T > 2 && T < 24) { const u = (T - 2) / 22; A.push({ fly: true, x: lerp(-150, 150, u), y: 30, z: 96, f: 1, label: 'Quetzalcoatlus', note: 'Wingspan about 10 metres.' }); }

    },
  },
  ice: {
    loop: 50, sky: '#d9dccf', tz: 90, dist: 60,
    cap: '<b>A Neanderthal rock shelter, about 50,000 years ago.</b> Smoke drifts from the hearths at the cave mouth; one person tends the fire, one works stone, two go down to the river and back. A woolly mammoth family crosses the valley, the calf at its mother’s side; a woolly rhinoceros grazes the steppe. Neanderthals organised their rock shelters around several hearths (their card and sources). Not one real place: a sketch of the kind of place.<small>The mammoths are drawn as a family group, as elephants live today — a guess from their living relatives. Smoke only rises from caves whose card names hearths or fire. The animals are drawn a little larger than life so they can be seen. A prototype of how the close-up of the map could look.</small>',
    river: x => 84 + x * 0.1 + 3 * Math.sin(x * 0.05), riverW: x => 5 + 1.2 * Math.sin(x * 0.07 + 2),
    cliff: { z: 136, x0: -210, x1: 70, top: x => 24 + 4 * Math.sin(x * 0.07) + 2 * Math.sin(x * 0.23), cave: [-44, -18, 10] },
    colour(x, z) {
      const n = fbm(x * 0.03, z * 0.03), m = fbm(x * 0.09 + 13, z * 0.09), sn = fbm(x * 0.05 + 70, z * 0.05 - 20, 5), dz = Math.abs(z - this.river(x)), w = this.riverW(x);
      let col = mixc(hex('#b5aa7b'), hex('#9d9a6a'), ss((n - 0.45) * 4));               // dry steppe ↔ greener
      col = mixc(col, hex('#c8bc90'), ss((m - 0.6) * 5) * 0.7);
      col = mixc(col, hex('#f0f1ec'), ss((sn - 0.6) * 9));                              // snow lying in drifts
      if (z > this.cliff.z - 16) col = mixc(col, mixc(hex('#cfc6ae'), hex('#b3a88f'), m), ss((z - (this.cliff.z - 16)) / 4));   // scree under the cliff
      const path = Math.abs(x - lerp(-30, -10, clamp((this.cliff.z - 4 - z) / (this.cliff.z - 4 - this.river(-10)), 0, 1))); if (z < this.cliff.z - 2 && z > this.river(-10) + 4 && path < 1.1) col = mixc(col, hex('#9d8f74'), 0.7);   // a worn path to the water
      if (dz < w + 3) col = mixc(col, hex('#c7c0aa'), ss((w + 3 - dz) / 1.5));            // gravel banks
      if (dz < w) col = mixc(hex('#7d9ea3'), hex('#55777f'), ss((w - dz) / (w * 0.7)));  // cold water

    },
    plants() {
      const P = [], R = this.river.bind(this);
      for (let i = 0; i < 70; i++) { const x0 = -100 + hash(i, 40) * 200, z0 = 58 + hash(i, 41) * 72, n = 4 + Math.floor(hash(i, 42) * 8);
        if (Math.abs(z0 - R(x0)) < this.riverW(x0) + 3 || z0 > this.cliff.z - 6) continue;
        for (let j = 0; j < n; j++) P.push({ kind: 'grass', x: x0 + (hash(i * 9 + j, 43) - 0.5) * 8, z: z0 + (hash(i * 9 + j, 44) - 0.5) * 5, h: 0.5 + hash(i * 9 + j, 45) * 0.5, ph: i * 9 + j, dry: hash(i, 46) < 0.5 }); }
      for (let i = 0; i < 22; i++) P.push({ kind: 'spruce', x: 40 + hash(i, 47) * 120, z: 108 + hash(i, 48) * 50, h: 9 + hash(i, 49) * 8, ph: i });
      for (let i = 0; i < 26; i++) { const x = -110 + hash(i, 50) * 220, z = R(x) + (hash(i, 51) < 0.5 ? -1 : 1) * (this.riverW(x) + 2.5); P.push({ kind: 'shrub', x, z, h: 1.1 + hash(i, 52), ph: i + 60 }); }

    },
    actors(t) {
      const A = [], T = t;
      const mk = [[0, 90, 116], [50, -110, 110]];
      [[0, 0, 1], [-4.5, -2.5, 0.48], [9, 4, 0.95]].forEach((d, i) => { const q = track(mk, T - i * 0.8 + (i === 1 ? 0.5 : 0));
        A.push({ sp: SP.mammoth, x: q.x + d[0], z: q.z + d[1], f: -1, P: { walk: 1, ph: T * 0.5 + i * 0.3, graze: 0.25 * win(T, 20 + i, 26 + i, 1), tailSway: Math.sin(T + i), t: T, seed: i }, k: d[2], label: i === 0 ? 'Woolly mammoth (a family group)' : null, note: i === 1 ? 'A calf at its mother’s side.' : 'Drawn as a family, as elephants live today — a guess.' }); });
      { const q = track([[0, 22, 66], [25, 12, 63], [50, 22, 66]], T), up = win(T, 19, 23.5, 0.8);
        A.push({ sp: SP.rhino, x: q.x, z: q.z, f: q.vx < 0 ? -1 : 1, P: { walk: clamp(Math.hypot(q.vx, q.vz) / 0.8, 0, 1) * (1 - up), ph: T * 0.45, graze: (1 - up) * 0.9, alert: up, tailSway: Math.sin(T * 1.3), t: T }, label: 'Woolly rhinoceros', note: 'A cold-steppe grazer with two horns.' }); }
      A.push({ person: true, x: -31, z: 133, f: 1, P: { sit: 1, t: T }, note: 'Tending the hearth.' });
      A.push({ person: true, x: -22, z: 131, f: -1, P: { knap: 1, crouch: 0.6, t: T }, label: 'Neanderthals', note: 'Their shelters were organised around several hearths (their card).' });
      const wet = this.river(-10) + this.riverW(-10) + 1.5, pk = [[0, -29, 130], [5, -29, 130], [19, -10, wet], [27, -10, wet], [41, -29, 130], [50, -29, 130]];
      [0, 1].forEach(i => { const q = track(pk, T - i * 1.1), sp = Math.hypot(q.vx, q.vz);
        A.push({ person: true, x: q.x + i * 1.6, z: q.z + i * 0.8, f: q.vx < 0 ? -1 : 1, P: { walk: clamp(sp / 1, 0, 1), ph: T * 1.1 + i * 0.5, crouch: win(T, 19.5 + i, 26.5, 0.6), t: T }, note: 'Going down to the water.' }); });

};

// ── the frame ──
const BIG = 1.35;                                    // animals and people drawn this much larger than life against the land
let S = SCENES.cret, plants = [], still = false, t0 = performance.now(), intro = 0, hits = [];
const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
function useScene(id) {
  S = SCENES[id]; CAM.tz = S.tz; GZ0 = S.tz - 125; GZ1 = S.tz + 135; paintGround((x, z) => S.colour(x, z)); plants = S.plants(); t0 = performance.now(); intro = 0;
  document.getElementById('cap').innerHTML = S.cap;
  document.querySelectorAll('[data-s]').forEach(b => b.classList.toggle('on', b.dataset.s === id));
}
function drawCliff(t) {
  const C = S.cliff; if (!C) return;
  const pts = []; for (let x = C.x0; x <= C.x1; x += 3) pts.push([x, C.top(x)]);
  const top = pts.map(p => proj(p[0], p[1], C.z)), bot = pts.map(p => proj(p[0], 0, C.z));
  const g = c.createLinearGradient(0, Math.min(...top.map(p => p[1])), 0, Math.max(...bot.map(p => p[1])));
  g.addColorStop(0, '#e2dac4'); g.addColorStop(0.6, '#cdc2a6'); g.addColorStop(1, '#a99c80');
  c.beginPath(); top.forEach((p, i) => i ? c.lineTo(p[0], p[1]) : c.moveTo(p[0], p[1])); for (let i = bot.length - 1; i >= 0; i--) c.lineTo(bot[i][0], bot[i][1]); c.closePath(); c.fillStyle = g; c.fill();
  c.strokeStyle = 'rgba(90,75,55,0.35)'; c.lineWidth = 1.2;                    // limestone beds
  for (let k = 1; k < 7; k++) { c.beginPath(); pts.forEach((p, i) => { const q = proj(p[0], p[1] * k / 7 + Math.sin(p[0] * 0.3 + k) * 0.3, C.z); i ? c.lineTo(q[0], q[1]) : c.moveTo(q[0], q[1]); }); c.stroke(); }
  c.strokeStyle = INK; c.lineWidth = 1.5; c.beginPath(); top.forEach((p, i) => i ? c.lineTo(p[0], p[1]) : c.moveTo(p[0], p[1])); c.stroke();
  // the cave mouth, with the hearth glowing inside
  const [a, b, h] = C.cave; c.beginPath();
  for (let i = 0; i <= 20; i++) { const u = i / 20, x = lerp(a, b, u), y = h * Math.sin(Math.PI * u) * (0.8 + 0.2 * Math.sin(u * 9)); const q = proj(x, y, C.z - 0.1); i ? c.lineTo(q[0], q[1]) : c.moveTo(q[0], q[1]); }
  c.closePath(); c.fillStyle = '#2b2219'; c.fill();
  const f = proj((a + b) / 2 - 2, 1, C.z - 0.2), pul = 0.75 + 0.15 * Math.sin(t * 6.3) + 0.1 * Math.sin(t * 11.1);
  const gl = c.createRadialGradient(f[0], f[1], 0, f[0], f[1], 60 * pul); gl.addColorStop(0, 'rgba(255,200,110,0.95)'); gl.addColorStop(0.35, 'rgba(240,120,40,0.55)'); gl.addColorStop(1, 'rgba(120,40,10,0)');
  c.fillStyle = gl; c.beginPath(); c.arc(f[0], f[1], 60 * pul, 0, TAU); c.fill();
}
function drawSmoke(t) {
  const C = S.cliff; if (!C) return;
  const [a, b, h] = C.cave, base = [(a + b) / 2 - 1, h * 0.9, C.z - 1.5];
  for (let i = 0; i < 46; i++) {
    const age = ((t * 0.07 + i / 46) % 1), x = base[0] + age * 34 + Math.sin(i * 1.7 + t * 0.5) * 2 * age, y = base[1] + age * 38, z = base[2] - age * 6;
    const [X, Y, s] = proj(x, y, z), r = (1.5 + age * 7) * s;
    c.fillStyle = `rgba(232,230,226,${0.32 * (1 - age) * Math.min(1, age * 8)})`; c.beginPath(); c.arc(X, Y, r, 0, TAU); c.fill();
  }
}
function drawWater(t) {
  c.lineCap = 'round';
  for (let i = 0; i < 150; i++) {
    const x = GX0 + ((hash(i, 60) * (GX1 - GX0) + t * (4 + hash(i, 61) * 3)) % (GX1 - GX0)), off = (hash(i, 62) - 0.5) * S.riverW(x) * 1.5, z = S.river(x) + off;
    const p = proj(x, 0, z), q = proj(x + 2.5, 0, S.river(x + 2.5) + off), a = 0.25 + 0.25 * Math.sin(t * 2 + i);
    c.strokeStyle = `rgba(235,245,240,${a})`; c.lineWidth = Math.max(0.8, 0.18 * p[2]); c.beginPath(); c.moveTo(p[0], p[1]); c.lineTo(q[0], q[1]); c.stroke();
  }
}
function shadowAt(x, z, len, k = 1, alt = 0) { const p = proj(x + len * 0.12 + alt * 0.4, 0, z - len * 0.08 - alt * 0.5); c.fillStyle = alt ? 'rgba(30,22,10,0.13)' : 'rgba(30,22,10,0.26)'; c.beginPath(); c.ellipse(p[0], p[1], len * 0.45 * k * p[2], len * 0.11 * k * p[2], 0, 0, TAU); c.fill(); }
function label(text, X, Y) { c.font = 'italic 600 16px Georgia, serif'; c.textAlign = 'center'; c.textBaseline = 'top'; c.lineWidth = 4; c.strokeStyle = 'rgba(250,242,220,0.9)'; c.strokeText(text, X, Y); c.fillStyle = INK; c.fillText(text, X, Y); }

function frame(now) {
  const t = still || reduce ? 21 : (now - t0) / 1000, lt = ((t % S.loop) + S.loop) % S.loop;
  intro = still || reduce ? 1 : Math.min(1, intro + 1 / 120);
  const k = ss(intro); setCam(lerp(1.45, 0.8, k), lerp(240, S.dist, k));          // from looking down on the map to the tilted close-up
  c.fillStyle = S.sky; c.fillRect(0, 0, W, H);
  drawGround(); drawWater(t);
  const show = ss((intro - 0.45) / 0.4);                                          // life stands up as the view tilts
  c.globalAlpha = show;
  const acts = S.actors(lt), items = [];
  for (const p of plants) items.push({ z: p.z, draw: () => drawPlant(p, t) });
  for (const a of acts) items.push({ z: a.z, a });
  if (S.cliff) items.push({ z: S.cliff.z, draw: () => { c.globalAlpha = 1; drawCliff(t); c.globalAlpha = show; } }, { z: S.cliff.z - 1.6, draw: () => drawSmoke(t) });
  for (const a of acts) { if (a.fly) { shadowAt(a.x, a.z, 10 * BIG, 1, a.y); continue; } shadowAt(a.x, a.z, (a.person ? 0.8 : a.sp.len) * BIG, a.k || 1); }
  items.sort((p, q) => q.z - p.z); hits = []; const labels = [];
  for (const it of items) {
    if (it.draw) { it.draw(); continue; }
    const a = it.a;
    if (a.fly) { const [X, Y, s] = proj(a.x, a.y, a.z); drawFlyer(X, Y, s, a.f, t); hits.push([X - 30, Y - 20, X + 30, Y + 20, a.label, a.note]); if (a.label) labels.push([a.label, X, Y + 18]); continue; }
    const [X, Y, s] = proj(a.x, 0, a.z);
    if (a.person) drawPerson(X, Y, s * BIG, a.f, a.P); else drawAnimal(a.sp, X, Y, s * BIG, a.f, a.P, a.k || 1);
    const len = (a.person ? 1 : a.sp.len) * (a.k || 1) * s * BIG, ht = (a.person ? 1.7 : a.sp.len * 0.45) * (a.k || 1) * s * BIG;
    hits.push([X - len * 0.55, Y - ht, X + len * 0.55, Y + 4, a.person ? 'Neanderthal' : a.sp.name, a.note]);
    if (a.label) labels.push([a.label, X, Y + 6]);
  }
  for (const L of labels) label(...L);
  if (S === SCENES.ice) {                                                         // snow on the wind
    c.fillStyle = 'rgba(255,255,255,0.75)';
    for (let i = 0; i < 120; i++) { const x = ((hash(i, 70) * W + t * (40 + hash(i, 71) * 30)) % (W + 40)) - 20, y = ((hash(i, 72) * H + t * (25 + hash(i, 73) * 20)) % (H + 20)) - 10; c.beginPath(); c.arc(x, y, 1 + hash(i, 74) * 1.6, 0, TAU); c.fill(); }
  }
  c.globalAlpha = 1;
  requestAnimationFrame(frame);
}
// hover or tap: what is it?
const tip = document.getElementById('tip');
function pick(e) {
  const r = cv.getBoundingClientRect(), x = (e.clientX - r.left) * W / r.width, y = (e.clientY - r.top) * H / r.height;
  const h = hits.slice().reverse().find(b => x > b[0] && x < b[2] && y > b[1] && y < b[3]);
  if (!h) { tip.style.display = 'none'; return; }
  tip.innerHTML = '<b>' + h[4] + '</b>' + (h[5] || ''); tip.style.display = 'block';
  tip.style.left = Math.min(r.width - 290, e.clientX - r.left + 12) + 'px'; tip.style.top = (e.clientY - r.top + 12) + 'px';
}
cv.addEventListener('pointermove', pick); cv.addEventListener('pointerdown', pick); cv.addEventListener('pointerleave', () => tip.style.display = 'none');
document.querySelectorAll('[data-s]').forEach(b => b.onclick = () => useScene(b.dataset.s));
document.getElementById('again').onclick = () => { intro = 0; };
document.getElementById('still').onclick = e => { still = !still; e.target.classList.toggle('on', still); };
window.__frame = (scene, t, tilt = 1) => { useScene(scene); t0 = performance.now() - t * 1000; intro = tilt; };
useScene('cret'); requestAnimationFrame(frame);
</script>
